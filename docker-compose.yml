# Todos los microservicios usan el proyecto "plazoleta" para agruparse en Docker Desktop.
name: plazoleta

services:
  postgres-plazoleta:
    image: postgres:16
    container_name: postgres-plazoleta
    environment:
      POSTGRES_DB: plazoleta_plazoleta
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - plazoleta-data:/var/lib/postgresql/data

volumes:
  plazoleta-data:
    name: plazoleta-plazoleta_plazoleta-data
